name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run PyTest
      #   run: |
      #     cd backend
      #     pytest tests/

      - name: Build Docker Image
        run: |
          cd backend
          docker build -t placementprep-api:latest .

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/placementprep/backend
            git pull origin main
            
            # Rebuild and restart API containers
            docker-compose down api celery_worker
            docker-compose build
            docker-compose up -d api celery_worker
            
            # Clean up dangling images
            docker image prune -f
