<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result - PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .result-card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-value { font-size: 2.5rem; font-weight: 700; line-height: 1; margin-bottom: 0.5rem; }
        .review-card { border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 1.5rem; padding: 1.5rem; background: #fff; }
        .review-card.correct { border-left: 5px solid #22c55e; }
        .review-card.wrong { border-left: 5px solid #ef4444; }
        .review-card.skipped { border-left: 5px solid #94a3b8; }
        
        .opt-review { padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .opt-review.is-correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; font-weight: 600; }
        .opt-review.is-selected-wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; text-decoration: line-through; }
    </style>
</head>
<body class="bg-light">
    <!-- Top Navbar Minimal -->
    <header class="top-navbar justify-content-between px-4 py-3 bg-white shadow-sm d-flex align-items-center">
        <div class="fw-bold fs-5 text-primary"><a href="aptitude.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Dashboard</a></div>
        <div>
            <a href="aptitude-history.html" class="btn btn-outline-primary rounded-pill px-4 btn-sm">View History</a>
        </div>
    </header>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Test Performance Report</h2>
            <p class="text-muted">Review your detailed performance analysis.</p>
        </div>

        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Analyzing results...</p>
        </div>

        <div id="resultContent" class="d-none">
            <!-- Stats Row -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card result-card border-0 h-100 p-4 text-center">
                        <div class="stat-value text-primary" id="rScore">0</div>
                        <p class="text-muted fw-medium mb-0">Total Score</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card result-card border-0 h-100 p-4 text-center">
                        <div class="stat-value text-success" id="rAccuracy">0%</div>
                        <p class="text-muted fw-medium mb-0">Accuracy</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card result-card border-0 h-100 p-4 text-center">
                        <div class="stat-value text-dark" id="rTime">0s</div>
                        <p class="text-muted fw-medium mb-0">Time Taken</p>
                    </div>
                </div>
            </div>

            <!-- Breakdown -->
            <div class="card result-card border-0 mb-5 p-4">
                <h5 class="fw-bold mb-4">Attempt Breakdown</h5>
                <div class="row text-center">
                    <div class="col-3">
                        <h3 class="fw-bold text-dark" id="rTotal">0</h3>
                        <span class="text-muted small fw-medium">TOTAL</span>
                    </div>
                    <div class="col-3">
                        <h3 class="fw-bold text-success" id="rCorrect">0</h3>
                        <span class="text-muted small fw-medium">CORRECT</span>
                    </div>
                    <div class="col-3">
                        <h3 class="fw-bold text-danger" id="rWrong">0</h3>
                        <span class="text-muted small fw-medium">WRONG</span>
                    </div>
                    <div class="col-3">
                        <h3 class="fw-bold text-secondary" id="rSkipped">0</h3>
                        <span class="text-muted small fw-medium">SKIPPED</span>
                    </div>
                </div>
            </div>

            <!-- Detailed Review -->
            <h4 class="fw-bold mb-4">Question Review</h4>
            <div id="reviewContainer">
                <!-- Review cards injected here -->
            </div>
            
            <div class="text-center mt-5">
                <a href="aptitude.html" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">Continue Learning</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            if(!sessionId) {
                alert("Invalid result ID");
                window.location.href = 'aptitude.html';
                return;
            }
            
            try {
                const res = await fetch(`http://localhost:1111/api/v1/aptitude/result/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if(data.success && data.data) {
                    const result = data.data;
                    document.getElementById('loader').classList.add('d-none');
                    document.getElementById('resultContent').classList.remove('d-none');
                    
                    document.getElementById('rScore').textContent = result.score;
                    document.getElementById('rAccuracy').textContent = result.accuracy_percentage.toFixed(1) + '%';
                    
                    const t = result.time_taken_seconds;
                    const m = Math.floor(t / 60);
                    const s = t % 60;
                    document.getElementById('rTime').textContent = m > 0 ? `${m}m ${s}s` : `${s}s`;
                    
                    document.getElementById('rTotal').textContent = result.total_questions;
                    document.getElementById('rCorrect').textContent = result.correct_answers;
                    document.getElementById('rWrong').textContent = result.wrong_answers;
                    document.getElementById('rSkipped').textContent = result.skipped_answers;
                    
                    const reviewContainer = document.getElementById('reviewContainer');
                    reviewContainer.innerHTML = '';
                    
                    result.questions.forEach((qData, index) => {
                        const q = qData.question;
                        const a = qData.attempt;
                        
                        let statusClass = 'skipped';
                        let statusText = '<span class="badge bg-secondary">Skipped</span>';
                        if(a.selected_answer) {
                            if(a.is_correct) {
                                statusClass = 'correct';
                                statusText = '<span class="badge bg-success">Correct</span>';
                            } else {
                                statusClass = 'wrong';
                                statusText = '<span class="badge bg-danger">Wrong</span>';
                            }
                        }
                        
                        const options = [q.option_a, q.option_b, q.option_c, q.option_d];
                        let optionsHtml = '';
                        
                        options.forEach(opt => {
                            let optClass = 'opt-review';
                            let icon = '';
                            if(opt === q.correct_answer) {
                                optClass += ' is-correct';
                                icon = ' <i class="bi bi-check-circle-fill float-end mt-1"></i>';
                            } else if (opt === a.selected_answer) {
                                optClass += ' is-selected-wrong';
                                icon = ' <i class="bi bi-x-circle-fill float-end mt-1"></i>';
                            }
                            optionsHtml += `<div class="${optClass}">${opt}${icon}</div>`;
                        });
                        
                        const explanationHtml = q.explanation ? `
                            <div class="mt-4 p-3 bg-light rounded border">
                                <h6 class="fw-bold text-dark mb-2"><i class="bi bi-lightbulb text-warning"></i> Explanation:</h6>
                                <p class="mb-0 small">${q.explanation}</p>
                            </div>
                        ` : '';
                        
                        const cardHtml = `
                            <div class="review-card ${statusClass}">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6 class="fw-bold text-muted mb-0">Question ${index + 1}</h6>
                                    <div>
                                        ${statusText}
                                        <span class="ms-2 text-muted small"><i class="bi bi-stopwatch"></i> ${a.time_taken_seconds || 0}s</span>
                                    </div>
                                </div>
                                <h5 class="mb-4 lh-base">${q.text.replace(/\n/g, '<br>')}</h5>
                                <div class="options-grid">
                                    ${optionsHtml}
                                </div>
                                ${explanationHtml}
                            </div>
                        `;
                        reviewContainer.innerHTML += cardHtml;
                    });
                    
                } else {
                    alert("Failed to load results: " + data.message);
                    window.location.href = 'aptitude.html';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `<div class="alert alert-danger">Error loading results.</div>`;
            }
        });
    </script>
</body>
</html>
