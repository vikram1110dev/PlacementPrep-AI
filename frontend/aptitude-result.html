<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result - PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-light">
    <!-- Top Navbar Minimal -->
    <header class="top-navbar justify-content-between px-4 py-3 bg-white shadow-sm d-flex align-items-center">
        <div class="fw-bold fs-5 text-primary"><a href="aptitude.html" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Dashboard</a></div>
    </header>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Test Results</h2>
            <p class="text-muted">Review your performance and explanations.</p>
        </div>

        <div class="row mb-5 text-center">
            <div class="col-md-3 mb-3">
                <div class="card border-0 shadow-sm p-4">
                    <h1 class="text-primary fw-bold" id="score">-</h1>
                    <p class="text-muted mb-0">Score</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card border-0 shadow-sm p-4">
                    <h1 class="text-success fw-bold" id="accuracy">-%</h1>
                    <p class="text-muted mb-0">Accuracy</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card border-0 shadow-sm p-4">
                    <h1 class="text-success fw-bold" id="correct">-</h1>
                    <p class="text-muted mb-0">Correct Answers</p>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card border-0 shadow-sm p-4">
                    <h1 class="text-dark fw-bold" id="total">-</h1>
                    <p class="text-muted mb-0">Total Questions</p>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-5" id="loader">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading Results...</p>
        </div>

        <!-- Explanations could be fetched and rendered here if the API supported returning full session details including questions. -->
        <!-- For MVP, we just show the summary stats based on the history API. -->
        
        <div class="text-center mt-5">
            <a href="aptitude.html" class="btn btn-primary rounded-pill px-4">Continue Learning</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            
            try {
                // Fetch History to find this session's result
                const res = await fetch(`http://localhost:1111/api/v1/aptitude/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('loader').classList.add('d-none');
                
                if(data.success && data.data) {
                    let sessionResult = data.data.find(s => s.session_id === sessionId);
                    if(!sessionResult && data.data.length > 0) {
                        // Fallback to latest
                        sessionResult = data.data[0];
                    }
                    
                    if(sessionResult) {
                        document.getElementById('score').innerText = sessionResult.score;
                        document.getElementById('accuracy').innerText = sessionResult.accuracy_percentage.toFixed(0) + '%';
                        document.getElementById('correct').innerText = sessionResult.correct_answers;
                        document.getElementById('total').innerText = sessionResult.total_questions;
                    }
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `<div class="alert alert-danger">Error loading results.</div>`;
            }
        });
    </script>
</body>
</html>
