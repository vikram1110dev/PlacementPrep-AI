<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty States References | PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }
        .empty-icon {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light p-5">
    <div class="container">
        <h3 class="fw-bold mb-4">Empty State Library</h3>
        
        <div class="row g-4">
            
            <!-- No Projects -->
            <div class="col-md-6">
                <div class="card-solid empty-state">
                    <i class="bi bi-folder-x empty-icon"></i>
                    <h5 class="fw-bold">No Projects Found</h5>
                    <p class="text-muted small">You haven't added any projects to your portfolio yet.</p>
                    <button class="btn btn-primary-custom mt-2"><i class="bi bi-plus me-1"></i>Add Project</button>
                </div>
            </div>

            <!-- No Search Results -->
            <div class="col-md-6">
                <div class="card-solid empty-state">
                    <i class="bi bi-search empty-icon"></i>
                    <h5 class="fw-bold">No Results Found</h5>
                    <p class="text-muted small">We couldn't find any coding problems matching "React Hooks".</p>
                    <button class="btn btn-outline-secondary rounded-pill mt-2 px-4">Clear Filters</button>
                </div>
            </div>

            <!-- No Notifications -->
            <div class="col-md-6">
                <div class="card-solid empty-state">
                    <i class="bi bi-bell-slash empty-icon"></i>
                    <h5 class="fw-bold">All Caught Up!</h5>
                    <p class="text-muted small">You have no new notifications at this time.</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
