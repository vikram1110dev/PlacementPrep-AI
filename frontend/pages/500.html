<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error | PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/utilities.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body class="flex-center min-vh-100 bg-light">
    <div class="container text-center animate-slide-up">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-4 text-danger" style="font-size: 8rem;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h1 class="fw-bold display-1 text-danger mb-0">500</h1>
                <h3 class="fw-bold mb-3">Internal Server Error</h3>
                <p class="text-muted mb-4">Oops! Something went wrong on our end. We are working hard to fix the issue. Please try again later.</p>
                <button onclick="window.location.reload()" class="btn btn-outline-danger px-5 py-2 fw-medium rounded-pill">
                    <i class="bi bi-arrow-clockwise me-2"></i> Retry
                </button>
            </div>
        </div>
    </div>
</body>
</html>
