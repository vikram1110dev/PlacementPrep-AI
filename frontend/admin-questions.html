<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - Admin | PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <aside class="admin-sidebar shadow">
        <a href="admin-dashboard.html" class="admin-brand"><i class="bi bi-robot text-primary"></i> PlacementPrep Admin</a>
        <div class="admin-nav">
            <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="admin-users.html" class="nav-link"><i class="bi bi-people"></i> Users</a>
            <a href="admin-companies.html" class="nav-link"><i class="bi bi-building"></i> Companies</a>
            <a href="admin-questions.html" class="nav-link active"><i class="bi bi-journal-code"></i> Question Bank</a>
            <a href="admin-settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar shadow-sm">
            <h5 class="mb-0 fw-bold">Question Bank Management</h5>
            <div class="d-flex gap-2">
                <button id="btnImport" class="btn btn-outline-secondary btn-sm"><i class="bi bi-cloud-upload"></i> Import CSV</button>
                <button id="btnExport" class="btn btn-outline-secondary btn-sm"><i class="bi bi-cloud-download"></i> Export</button>
                <button id="btnAddQuestion" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add Question</button>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex gap-2 w-50">
                        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search questions by title or tag...">
                        <select id="typeFilter" class="form-select form-select-sm">
                            <option value="">All Types</option>
                            <option value="DSA">DSA</option>
                            <option value="Aptitude">Aptitude</option>
                        </select>
                        <select id="difficultyFilter" class="form-select form-select-sm">
                            <option value="">All Difficulties</option>
                            <option value="EASY">Easy</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HARD">Hard</option>
                        </select>
                    </div>
                </div>

                <div class="admin-table-wrapper">
                    <table class="table admin-table mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Difficulty</th>
                                <th>Companies</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dynamic content injected by admin-questions.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Question Form Modal -->
    <div class="modal fade" id="questionModal" tabindex="-1" aria-labelledby="questionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form id="questionForm">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="questionModalLabel">Add Question</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="q_id">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Topic ID</label>
                        <input type="number" class="form-control" id="q_topic_id" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Difficulty</label>
                        <select class="form-select" id="q_difficulty" required>
                            <option value="EASY">Easy</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HARD">Hard</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Question Text</label>
                        <textarea class="form-control" id="q_text" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option A</label>
                        <input type="text" class="form-control" id="q_opt_a" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option B</label>
                        <input type="text" class="form-control" id="q_opt_b" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option C</label>
                        <input type="text" class="form-control" id="q_opt_c" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option D</label>
                        <input type="text" class="form-control" id="q_opt_d" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correct Answer</label>
                        <input type="text" class="form-control" id="q_correct" required placeholder="Exact text of correct option">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Marks</label>
                        <input type="number" class="form-control" id="q_marks" value="1">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Explanation</label>
                        <textarea class="form-control" id="q_explanation" rows="2"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Company (Tags)</label>
                        <input type="text" class="form-control" id="q_company">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tags</label>
                        <input type="text" class="form-control" id="q_tags">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Time Limit (secs)</label>
                        <input type="number" class="form-control" id="q_time" value="60">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Question</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Import Modal -->
    <div class="modal fade" id="importModal" tabindex="-1" aria-labelledby="importModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <form id="importForm">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="importModalLabel">Import Questions (CSV)</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Upload CSV File</label>
                    <input type="file" class="form-control" id="importFile" accept=".csv" required>
                </div>
                <small class="text-muted">Required columns: topic_id, question_text, difficulty, option_a, option_b, option_c, option_d, correct_answer</small>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Upload</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-questions.js"></script>
</body>
</html>
