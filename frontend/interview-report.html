<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview - Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/interview.css">
</head>
<body onload="loadReport()">
    <div style="max-width: 1000px; margin: 4rem auto; width: 90%;">
        <div class="glass-panel">
            <div style="text-align: center; margin-bottom: 3rem;">
                <h1 style="color: var(--primary-color); margin-bottom: 0.5rem;">Interview Complete</h1>
                <p style="color: var(--text-secondary); font-size: 1.1rem;" id="role-display">Loading...</p>
            </div>
            
            <div class="report-grid">
                <div class="glass-panel stat-card" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3);">
                    <h3 style="color: var(--text-secondary); margin-bottom: 1rem; text-transform: uppercase; font-size: 0.9rem;">Overall Score</h3>
                    <div class="stat-value" id="overall-score">-- / 10</div>
                </div>
            </div>
            
            <div style="margin-top: 2rem;">
                <h3 style="color: var(--primary-color); margin-bottom: 1rem;">Key Strengths</h3>
                <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 1.5rem; background: rgba(15, 23, 42, 0.4);">
                    <p id="feedback-strengths" style="line-height: 1.6;"></p>
                </div>
                
                <h3 style="color: var(--warning-color); margin-bottom: 1rem;">Areas for Improvement</h3>
                <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 1.5rem; background: rgba(15, 23, 42, 0.4);">
                    <p id="feedback-weaknesses" style="line-height: 1.6;"></p>
                </div>
                
                <h3 style="color: var(--secondary-color); margin-bottom: 1rem;">Recommended Next Steps</h3>
                <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 1.5rem; background: rgba(15, 23, 42, 0.4);">
                    <p id="feedback-improvements" style="line-height: 1.6;"></p>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 3rem;">
                <button class="btn-primary" style="width: auto; margin-right: 1rem;" onclick="window.location.href='interview-history.html'">View All Interviews</button>
                <button class="btn-secondary" style="width: auto;" onclick="window.location.href='interview-setup.html'">Practice Again</button>
            </div>
        </div>
    </div>

    <script src="js/interview.js"></script>
</body>
</html>
