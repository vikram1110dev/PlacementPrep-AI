<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PlacementPrep AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="container auth-container">
        <div class="auth-card">
            <a href="login.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Login</a>
            
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-key fs-3"></i>
                </div>
                <h3 class="fw-bold mb-2">Forgot Password?</h3>
                <p class="text-muted">No worries, we'll send you reset instructions.</p>
            </div>

            <!-- Initial Form -->
            <form id="forgotPasswordForm" novalidate>
                <div class="mb-4">
                    <label for="resetEmail" class="form-label fw-medium">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="resetEmail" placeholder="Enter your email" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="resetBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Success Message (Hidden by default) -->
            <div id="successMessage" class="text-center d-none mt-4">
                <div class="alert alert-success d-flex align-items-center mb-0" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div>
                        Reset link has been sent to your email! Please check your inbox.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
